<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FTC GPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --orange:#F26B0F;--purple:#C21FE0;
  --paper:#FBF9FC;--panel:#F3EFF6;--line:#E2DBE8;--ink:#1D1626;--muted:#6F657C;
  --user-bg:#FFF1E6;--bot-bg:#FFFFFF;--focus:#C21FE0;
  --shadow:0 1px 2px rgba(29,22,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15111A;--panel:#1D1824;--line:#312A3A;--ink:#F1ECF5;--muted:#A69CB3;
  --user-bg:#2C1F17;--bot-bg:#1D1824;--shadow:none;}}
:root[data-theme="dark"]{--paper:#15111A;--panel:#1D1824;--line:#312A3A;--ink:#F1ECF5;--muted:#A69CB3;--user-bg:#2C1F17;--bot-bg:#1D1824;--shadow:none;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.55 Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* sidebar */
#side{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.brand img{width:34px;height:auto}
.brand b{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;font-style:italic}
.brand small.tn{font-size:11px;opacity:.85}
.newchat{margin:6px 12px 10px;padding:10px 12px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center}
.newchat:hover{opacity:.9}
.search{margin:0 12px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);width:calc(100% - 24px)}
#chats{flex:1;overflow-y:auto;padding:4px 8px 8px;list-style:none;margin:0}
#chats li{display:flex;align-items:center;gap:6px;border-radius:8px;padding:8px 6px 8px 10px;cursor:pointer;color:var(--ink)}
#chats li:hover{background:var(--paper)}
#chats li.active{background:var(--paper);box-shadow:inset 3px 0 0 var(--orange)}
#chats li span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#chats li .x{opacity:0;color:var(--muted);padding:2px 6px;border-radius:6px}
#chats li:hover .x,#chats li.active .x{opacity:1}
#chats li .x:hover{color:var(--orange)}
.sidefoot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--purple)}

/* main */
#main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;font-weight:700;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top .rule{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--orange) 0 50%,var(--purple) 50% 100%)}
.top{position:relative}
.iconbtn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{background:var(--panel);color:var(--ink)}
#menu{display:none}
#log{flex:1;overflow-y:auto;padding:24px 0 8px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.msg{display:flex;gap:12px;margin:0 0 20px}
.msg .av{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.msg.user .av{background:var(--orange);color:#fff}
.msg.bot .av{background:var(--bot-bg);border:1px solid var(--line)}
.msg.bot .av img{width:20px}
.msg .body{flex:1;min-width:0}
.msg .who{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.msg .txt{border-radius:12px;padding:10px 14px;background:var(--bot-bg);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user .txt{background:var(--user-bg);border-color:transparent}
.msg .txt code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:.92em}
.msg .txt pre{background:var(--panel);padding:10px 12px;border-radius:8px;overflow-x:auto;margin:8px 0}
.msg .txt pre code{background:none;padding:0}
.msg .txt strong{font-weight:700}
.msg .txt ul{margin:6px 0;padding-left:20px}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.chip .rm{color:var(--muted)}
.chip .rm:hover{color:var(--orange)}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple);margin-right:4px;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* empty state */
.empty{max-width:760px;margin:6vh auto 0;padding:0 20px;text-align:left}
.empty img{width:72px}
.empty h2{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:18px 0 8px;font-weight:800}
.empty h2 em{font-style:normal;background:linear-gradient(90deg,var(--orange),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty .byline{font-size:15px;font-weight:600;font-style:italic;color:var(--muted);margin:-4px 0 2px}
.empty .teams{font-size:12px;font-weight:500;font-style:italic;color:var(--muted);margin:0 0 12px}
.empty p{color:var(--muted);margin:0 0 22px;max-width:56ch}
.starters{margin-top:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.starters button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bot-bg);box-shadow:var(--shadow);line-height:1.4}
.starters button:hover{border-color:var(--purple)}
.starters small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* composer */
#composer{border-top:1px solid var(--line);padding:12px 20px 14px;background:var(--paper)}
.box{max-width:760px;margin:0 auto;border:1px solid var(--line);border-radius:14px;background:var(--bot-bg);padding:8px 8px 8px 12px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--purple)}
#pending{margin:2px 0 6px}
#pending:empty{display:none}
.row{display:flex;align-items:flex-end;gap:6px}
#input{flex:1;resize:none;border:0;background:none;padding:8px 0;max-height:180px;min-height:24px;line-height:1.5}
#input:focus{outline:none}
#send{width:36px;height:36px;border-radius:9px;background:var(--purple);color:#fff;display:inline-flex;align-items:center;justify-content:center}
#send:disabled{background:var(--line);color:var(--muted);cursor:default}
.hint{max-width:760px;margin:8px auto 0;font-size:12px;color:var(--muted);text-align:center}

.cite{margin-top:6px;font-size:12px;color:var(--muted)}

@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;width:min(300px,86vw)}
  #side.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19;display:none}
  #scrim.open{display:block}
  #menu{display:inline-flex}
  .empty h2{font-size:24px}
  #log{padding-top:16px}
}
</style>
</head>

<script>
(() => {
const $ = s => document.querySelector(s);
const LS = k => { try { return localStorage.getItem(k); } catch { return null; } };
const SS = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

/* ---------- state ---------- */
let chats = [];
try { chats = JSON.parse(LS('ftcgpt.chats') || '[]'); } catch { chats = []; }
let current = null;
let pendingFiles = [];
let busy = false;

const save = () => SS('ftcgpt.chats', JSON.stringify(chats));
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- backend call ---------- */
async function askModel(chat) {
  const last = chat.messages.length - 1;
  const messages = chat.messages.map((m, i) => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.text,
    files: i === last ? (m.files || []).map(f => ({ name: f.name, text: f.text })) : []
  }));
  const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Server returned ${r.status}.`);
  return j;
}

/* ---------- tiny markdown ---------- */
function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
function md(s) {
  const blocks = [];
  s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => { blocks.push(`<pre><code>${esc(c.trimEnd())}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = esc(s);
  // tables
  s = s.replace(/^\|(.+)\|\n\|[-| :]+\|\n((?:\|.*\|\n?)+)/gm, (_, h, rows) => {
    const cell = r => r.split('|').filter((x, i, a) => i > 0 && i < a.length - 1).map(x => x.trim());
    return `<table style="border-collapse:collapse;margin:8px 0"><tr>${cell('|' + h + '|').map(c => `<th style="text-align:left;border-bottom:1px solid var(--line);padding:4px 10px 4px 0">${c}</th>`).join('')}</tr>${rows.trim().split('\n').map(r => `<tr>${cell(r).map(c => `<td style="padding:4px 10px 4px 0;border-bottom:1px solid var(--line)">${c}</td>`).join('')}</tr>`).join('')}</table>`;
  });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/^(?:- (.*)(?:\n|$))+/gm, m => `<ul>${m.trim().split('\n').map(l => `<li>${l.slice(2)}</li>`).join('')}</ul>`)
       .replace(/^(?:\d+\. (.*)(?:\n|$))+/gm, m => `<ol style="margin:6px 0;padding-left:20px">${m.trim().split('\n').map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('')}</ol>`)
       .replace(/\n{2,}/g, '\n\n');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}

/* ---------- render ---------- */
const logo = document.querySelector('.brand img').src;
function renderList() {
  const q = $('#q').value.toLowerCase();
  const ul = $('#chats'); ul.innerHTML = '';
  chats.filter(c => !q || c.title.toLowerCase().includes(q) || c.messages.some(m => m.text.toLowerCase().includes(q)))
    .sort((a, b) => b.updated - a.updated)
    .forEach(c => {
      const li = document.createElement('li');
      li.className = c.id === current ? 'active' : '';
      li.innerHTML = `<span></span><button class="x" aria-label="Delete chat">✕</button>`;
      li.querySelector('span').textContent = c.title;
      li.onclick = () => { open(c.id); closeSide(); };
      li.querySelector('.x').onclick = e => { e.stopPropagation(); if (confirm(`Delete "${c.title}"?`)) { chats = chats.filter(x => x.id !== c.id); save(); if (current === c.id) current = null; renderAll(); } };
      ul.appendChild(li);
    });
}
function renderLog() {
  const log = $('#log'); log.innerHTML = '';
  const chat = chats.find(c => c.id === current);
  $('#title').textContent = chat ? chat.title : 'New chat';
  if (!chat || !chat.messages.length) {
    log.innerHTML = `<div class="empty"><img src="${logo}" alt=""><h2><em>FTC GPT</em></h2><div class="byline">made by Arcturus Robotics</div><div class="teams">FTC Teams #13245 &amp; #26537</div><p>Rules, inspection and hardware, answered from the official manuals and vendor parts lists.</p><div class="starters"></div></div>`;
    const st = log.querySelector('.starters');
    ['How big can the robot be at the start?', 'How many motors are allowed?', 'Compare Yellow Jacket, NeveRest and HD Hex motors', 'What servos can I use and how are they powered?', 'Can we 3D print or machine our own parts?', 'Who is allowed at the field during a match?']
      .forEach(t => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { $('#input').value = t; onInput(); send(); }; st.appendChild(b); });
    return;
  }
  const wrap = document.createElement('div'); wrap.className = 'wrap';
  for (const m of chat.messages) wrap.appendChild(msgEl(m));
  if (busy) { const t = msgEl({ role: 'bot', text: '' }); t.querySelector('.txt').innerHTML = '<span class="typing"><span></span><span></span><span></span></span>'; wrap.appendChild(t); }
  log.appendChild(wrap); log.scrollTop = log.scrollHeight;
}
function msgEl(m) {
  const d = document.createElement('div'); d.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
  d.innerHTML = `<div class="av">${m.role === 'user' ? 'You' : `<img src="${logo}" alt="">`}</div><div class="body"><div class="who">${m.role === 'user' ? 'You' : 'FTC GPT'}</div>${m.files?.length ? `<div class="files">${m.files.map(f => `<span class="chip">📄 ${esc(f.name)} <span style="color:var(--muted);font-weight:500">${fmtSize(f.size)}</span></span>`).join('')}</div>` : ''}<div class="txt">${m.role === 'user' ? esc(m.text) : md(m.text)}</div>${m.sources?.length ? `<div class="cite">Sources: ${m.sources.map(esc).join(' · ')}</div>` : ''}</div>`;
  return d;
}
function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
function renderPending() {
  const p = $('#pending'); p.innerHTML = '';
  pendingFiles.forEach((f, i) => { const c = document.createElement('span'); c.className = 'chip'; c.innerHTML = `📄 ${esc(f.name)} <button class="rm" aria-label="Remove">✕</button>`; c.querySelector('.rm').onclick = () => { pendingFiles.splice(i, 1); renderPending(); onInput(); }; p.appendChild(c); });
}
let online = null;
async function checkStatus() {
  try { online = (await (await fetch('/api/status')).json()).model; } catch { online = false; }
  renderStatus();
}
function renderStatus() {
  $('#status').textContent = online ? `Connected · ${online}` : online === false ? 'Server offline' : 'Connecting…';
  $('#statusdot').style.background = online ? 'var(--purple)' : 'var(--orange)';
}
function renderAll() { renderList(); renderLog(); renderStatus(); }

/* ---------- actions ---------- */
function open(id) { current = id; renderAll(); $('#input').focus(); }
function newChat() { current = null; pendingFiles = []; renderPending(); renderAll(); $('#input').focus(); }
async function send() {
  const text = $('#input').value.trim();
  if (!text && !pendingFiles.length || busy) return;
  let chat = chats.find(c => c.id === current);
  if (!chat) { chat = { id: uid(), title: (text || pendingFiles[0].name).slice(0, 48), messages: [], updated: Date.now() }; chats.push(chat); current = chat.id; }
  chat.messages.push({ role: 'user', text, files: pendingFiles });
  chat.updated = Date.now(); save();
  pendingFiles = []; renderPending(); $('#input').value = ''; onInput();
  busy = true; renderAll();
  try { const a = await askModel(chat); chat.messages.push({ role: 'bot', text: a.answer, sources: a.sources }); }
  catch (e) { chat.messages.push({ role: 'bot', text: `**Couldn't reach the model.** ${e.message}\n\nCheck that ai.py is running and Ollama is reachable.` }); }
  busy = false; chat.updated = Date.now(); save(); renderAll();
}
function onInput() {
  const i = $('#input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 180) + 'px';
  $('#send').disabled = !(i.value.trim() || pendingFiles.length) || busy;
}
async function addFiles(list) {
  for (const f of list) {
    if (!/\.(txt|md|java|kt|py|json|csv)$/i.test(f.name)) { alert(`${f.name}: only text files are supported.`); continue; }
    if (f.size > 8 * 1048576) { alert(`${f.name} is over 8 MB.`); continue; }
    pendingFiles.push({ name: f.name, size: f.size, text: await f.text() });
  }
  renderPending(); onInput();
}
function exportChat() {
  const c = chats.find(x => x.id === current); if (!c) return;
  const body = `# ${c.title}\n\n` + c.messages.map(m => `**${m.role === 'user' ? 'You' : 'FTC GPT'}:**${m.files?.length ? ' _(files: ' + m.files.map(f => f.name).join(', ') + ')_' : ''}\n\n${m.text}\n`).join('\n---\n\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/markdown' })); a.download = c.title.replace(/[^\w]+/g, '-') + '.md'; a.click();
}
function closeSide() { $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }

/* ---------- wire up ---------- */
$('#new').onclick = () => { newChat(); closeSide(); };
$('#q').oninput = renderList;
$('#send').onclick = send;
$('#input').oninput = onInput;
$('#input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
$('#rename').onclick = () => { const c = chats.find(x => x.id === current); if (!c) return; const t = prompt('Chat name', c.title); if (t?.trim()) { c.title = t.trim().slice(0, 60); save(); renderAll(); } };
$('#export').onclick = exportChat;
$('#menu').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('open'); };
$('#scrim').onclick = closeSide;
$('#theme').onclick = () => { const r = document.documentElement; const dark = getComputedStyle(document.body).backgroundColor !== 'rgb(251, 249, 252)'; const next = dark ? 'light' : 'dark'; r.dataset.theme = next; SS('ftcgpt.theme', next); };
const th = LS('ftcgpt.theme'); if (th) document.documentElement.dataset.theme = th;


if (chats.length) current = chats.sort((a, b) => b.updated - a.updated)[0].id;
renderAll(); onInput(); checkStatus();
})();
</script>
</body>
</html>
